    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // PRNG determinístico (mulberry32) cho star field — seed riêng cho video này
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      (function buildStars() {
        var rand = mulberry32(20260923);
        var svg = document.getElementById('bg-stars');
        var n = 40;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < n; i++) {
          var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          var cx = rand() * 1080;
          var cy = rand() * 1920;
          var r = 1.5 + rand() * 1.5;
          var op = 0.15 + rand() * 0.25;
          c.setAttribute('cx', cx.toFixed(1));
          c.setAttribute('cy', cy.toFixed(1));
          c.setAttribute('r', r.toFixed(2));
          c.setAttribute('fill', '#fff');
          c.setAttribute('opacity', op.toFixed(2));
          frag.appendChild(c);
        }
        svg.appendChild(frag);
      })();

      tl.to('#bg-depth .blob', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', repeat: -1, yoyo: true, stagger: 3 }, 0);
      tl.to('#bg-stars circle', { opacity: '+=0.25', duration: 4, ease: 'sine.inOut', repeat: -1, yoyo: true, stagger: { each: 0.15, from: 'random' } }, 0);

      tl.set('#brand-anchor', { opacity: 1 }, 6.70);

      window.__timelines['main'] = tl;
    </script>
