    <script>
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      (function buildStars() {
        var rand = mulberry32(20261001);
        var svg = document.getElementById('bg-stars');
        var n = 40;
        for (var i = 0; i < n; i++) {
          var cx = rand() * 1080;
          var cy = rand() * 1920;
          var r = 1.5 + rand() * 1.5;
          var op = 0.15 + rand() * 0.25;
          var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', cx.toFixed(2));
          c.setAttribute('cy', cy.toFixed(2));
          c.setAttribute('r', r.toFixed(2));
          c.setAttribute('fill', '#ffffff');
          c.setAttribute('opacity', op.toFixed(2));
          c.setAttribute('class', 'star');
          svg.appendChild(c);
        }
      })();

      const tl = gsap.timeline({ paused: true });
      // Depth background: nền trôi rất chậm + sao nhấp nháy nhẹ, suốt video (repeat hữu hạn thay repeat:-1).
      tl.to('.blob', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', repeat: 2, yoyo: true, stagger: 3 }, 0);
      tl.to('#bg-stars .star', { opacity: '+=0.25', duration: 4, ease: 'sine.inOut', repeat: 16, yoyo: true, stagger: { each: 0.15, from: 'random' } }, 0);
      // Brand Anchor hiện ngay khi Hook kết thúc, giữ tới hết video.
      tl.set('#brand-anchor', { opacity: 1 }, 6.01);
      window.__timelines['main'] = tl;
    </script>
