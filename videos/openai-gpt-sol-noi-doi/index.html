    <script>
      // Deterministic starfield — mulberry32 PRNG, fixed seed. KHÔNG Math.random()/Date.now().
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(20260921);
      var starsSvg = document.getElementById('bg-stars');
      var STAR_COUNT = 40;
      for (var i = 0; i < STAR_COUNT; i++) {
        var cx = rand() * 1080;
        var cy = rand() * 1920;
        var r = 1.5 + rand() * 1.5;
        var op = 0.15 + rand() * 0.25;
        var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cx.toFixed(1));
        c.setAttribute('cy', cy.toFixed(1));
        c.setAttribute('r', r.toFixed(2));
        c.setAttribute('fill', '#fff');
        c.setAttribute('opacity', op.toFixed(2));
        starsSvg.appendChild(c);
      }

      const tl = gsap.timeline({ paused: true });
      tl.set('#brand-anchor', { opacity: 1 }, 5.42);
      // Depth background — 2-3 blobs drift slowly, stars twinkle. Finite repeat counts covering the
      // full 68.34s render (ceil(duration/cycle) - 1), never repeat:-1 (determinism rule).
      tl.to('.blob', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', yoyo: true, repeat: 3, stagger: 3 }, 0);
      tl.to('#bg-stars circle', { opacity: '+=0.25', duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 17, stagger: { each: 0.15, from: 'random' } }, 0);
      window.__timelines['main'] = tl;
    </script>
