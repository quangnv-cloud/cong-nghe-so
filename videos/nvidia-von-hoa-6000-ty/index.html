    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20261007);
      const starsSvg = document.getElementById('bg-stars');
      for (let i = 0; i < 40; i++) {
        const cx = rand() * 1080;
        const cy = rand() * 1920;
        const r = 1.5 + rand() * 1.5;
        const op = 0.15 + rand() * 0.25;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cx.toFixed(1));
        c.setAttribute('cy', cy.toFixed(1));
        c.setAttribute('r', r.toFixed(2));
        c.setAttribute('fill', '#fff');
        c.setAttribute('opacity', op.toFixed(2));
        c.id = 'star-' + i;
        starsSvg.appendChild(c);
      }

      tl.to('.blob', { x: '+=40', y: '-=30', duration: 18, ease: 'sine.inOut', repeat: -1, yoyo: true, stagger: 3 }, 0);
      tl.to('#bg-stars circle', { opacity: '+=0.25', duration: 4, ease: 'sine.inOut', repeat: -1, yoyo: true, stagger: { each: 0.15, from: 'random' } }, 0);

      tl.fromTo('#brand-anchor', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: 'power2.out' }, 7.95);

      window.__timelines['main'] = tl;
